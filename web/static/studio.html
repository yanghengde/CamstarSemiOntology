<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MES 需求-数字化本体图谱映射工作室 | Siemens Opcenter</title>
    <link rel="icon" type="image/svg+xml" href="/static/siemens_logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css" />
    <style>
        /* ── Page Custom Layout ── */
        #studio-layout {
            display: flex;
            height: calc(100vh - var(--topbar-h));
            margin-top: var(--topbar-h);
            background: var(--bg-primary);
            overflow: hidden;
        }

        /* ── Left Input Pane ── */
        .input-pane {
            width: 380px;
            height: 100%;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, rgba(0, 8, 16, 0.98) 100%);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden; /* Changed from auto to hidden to allow separate scroll areas */
            backdrop-filter: blur(16px);
        }

        /* ── Presets Scroll Area ── */
        .presets-scroll-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            padding-right: 4px;
        }

        /* ── Scenario QA Agent Widget ── */
        .qa-agent-wrapper {
            border-top: 1px solid var(--border-subtle);
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            height: 380px; /* Perfectly sized for bottom-left Q&A */
            flex-shrink: 0;
            background: rgba(0, 10, 20, 0.4);
            margin: 0 -20px -20px -20px;
            padding: 16px 20px;
            backdrop-filter: blur(10px);
        }

        .qa-agent-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .qa-agent-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--si-green);
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 0 8px rgba(0, 255, 185, 0.2);
        }

        .qa-agent-clear-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-secondary);
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .qa-agent-clear-btn:hover {
            border-color: var(--si-green);
            color: var(--si-green);
            background: rgba(0, 255, 185, 0.05);
        }

        .qa-agent-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            border: 1px solid rgba(0, 153, 153, 0.15);
            border-radius: 6px;
            background: rgba(0, 4, 8, 0.7);
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
            scrollbar-width: thin;
        }

        .qa-agent-msg {
            font-size: 11.5px;
            line-height: 1.5;
            padding: 8px 10px;
            border-radius: 6px;
            max-width: 90%;
            word-break: break-word;
            animation: qa-slide-up 0.2s ease;
        }

        @keyframes qa-slide-up {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .qa-agent-msg-system {
            background: rgba(0, 18, 36, 0.85);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            align-self: flex-start;
        }

        .qa-agent-msg-user {
            background: rgba(0, 255, 185, 0.08);
            border: 1px solid rgba(0, 255, 185, 0.25);
            color: #00FFB9;
            align-self: flex-end;
        }

        .qa-agent-typing {
            font-style: italic;
            color: var(--text-muted);
            animation: qa-pulse 1.5s infinite;
        }

        @keyframes qa-pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .qa-agent-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .qa-agent-input {
            flex: 1;
            background: rgba(0, 5, 10, 0.8);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 6px 10px;
            color: var(--text-primary);
            font-size: 11px;
            outline: none;
            transition: all 0.2s;
        }

        .qa-agent-input:focus {
            border-color: var(--si-green);
            box-shadow: 0 0 6px rgba(0, 255, 185, 0.2);
        }

        .qa-agent-send-btn {
            background: rgba(0, 255, 185, 0.08);
            border: 1px solid rgba(0, 255, 185, 0.35);
            color: var(--si-green);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .qa-agent-send-btn:hover {
            background: rgba(0, 255, 185, 0.2);
            border-color: var(--si-green);
            box-shadow: 0 0 8px rgba(0, 255, 185, 0.3);
        }

        .qa-agent-stop-btn {
            background: rgba(255, 102, 102, 0.08);
            border: 1px solid rgba(255, 102, 102, 0.35);
            color: #FF6666;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .qa-agent-stop-btn:hover {
            background: rgba(255, 102, 102, 0.2);
            border-color: #FF6666;
            box-shadow: 0 0 8px rgba(255, 102, 102, 0.3);
        }

        /* ── Clickable High-Fidelity Scenario Badge ── */
        .qa-badge-link {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 255, 185, 0.12);
            border: 1px solid rgba(0, 255, 185, 0.45);
            color: #00FFB9;
            font-family: 'Fira Code', monospace;
            font-weight: 700;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            margin: 0 2px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .qa-badge-link:hover {
            background: var(--si-green);
            color: #000D1A;
            box-shadow: 0 0 8px rgba(0, 255, 185, 0.5);
            transform: scale(1.05);
        }

        .pane-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--si-green);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 8px;
        }

        .preset-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preset-card:hover {
            border-color: var(--si-green);
            background: rgba(0, 255, 185, 0.04);
            transform: translateY(-1px);
        }

        .preset-card.active {
            border-color: var(--si-green);
            background: rgba(0, 255, 185, 0.08);
            box-shadow: 0 0 10px rgba(0, 255, 185, 0.15);
        }

        .preset-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0;
            flex: 1;
        }

        .preset-title-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 4px;
        }

        .preset-delete-btn {
            background: transparent;
            border: none;
            padding: 2px;
            cursor: pointer;
            color: var(--text-secondary);
            opacity: 0;
            transition: all 0.2s ease;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: -2px;
        }

        .preset-card:hover .preset-delete-btn,
        .preset-card.active .preset-delete-btn {
            opacity: 0.6;
        }

        .preset-delete-btn:hover {
            opacity: 1 !important;
            color: #FF4D4D !important;
        }

        .preset-planner-btn {
            background: transparent;
            border: none;
            padding: 2px;
            cursor: pointer;
            color: var(--text-secondary);
            opacity: 0;
            transition: all 0.2s ease;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: -2px;
        }

        .preset-card:hover .preset-planner-btn,
        .preset-card.active .preset-planner-btn {
            opacity: 0.6;
        }

        .preset-planner-btn:hover {
            opacity: 1 !important;
            color: var(--si-green) !important;
            filter: drop-shadow(0 0 4px rgba(0, 255, 185, 0.4));
        }

        /* ── Active Scenario Top Header ── */
        .scenario-active-header {
            background: linear-gradient(90deg, rgba(0, 153, 153, 0.12) 0%, rgba(0, 255, 185, 0.03) 100%);
            border: 1px solid rgba(0, 255, 185, 0.25);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            animation: card-slide-in 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .preset-desc {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .custom-textarea {
            width: 100%;
            flex: 1;
            min-height: 120px;
            background: rgba(0, 0, 10, 0.4);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 12px;
            line-height: 1.6;
            resize: none;
            outline: none;
            margin-top: 10px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .custom-textarea:focus {
            border-color: var(--si-green);
            box-shadow: 0 0 0 3px rgba(0, 255, 185, 0.1);
        }

        .studio-btn {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(0, 255, 185, 0.12);
            border: 1px solid rgba(0, 255, 185, 0.3);
            color: var(--si-green);
        }

        .studio-btn:hover {
            background: rgba(0, 255, 185, 0.22);
            border-color: var(--si-green);
            box-shadow: 0 0 12px rgba(0, 255, 185, 0.25);
            transform: translateY(-1px);
        }

        /* ── Center Content & Blueprint Panel ── */
        .center-pane {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background:
                radial-gradient(circle at 10% 20%, rgba(0, 153, 153, 0.05) 0%, transparent 40%),
                var(--bg-primary);
            position: relative;
            transition:
                flex-basis 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.18s ease;
        }

        .blueprint-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ── Roadmap Steps ── */
        .roadmap-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            position: relative;
            animation: card-slide-in 0.3s ease;
        }

        @keyframes card-slide-in {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .roadmap-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .step-badge {
            background: var(--si-petrol-dark);
            color: var(--si-green);
            font-size: 10px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            text-transform: uppercase;
        }

        .step-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            margin-left: 12px;
        }

        .step-description {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        /* ── Entity Twin Cards ── */
        .twins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .twin-card {
            background: rgba(0, 12, 24, 0.8);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 12px;
            transition: all 0.2s;
            position: relative;
        }

        .twin-card:hover {
            border-color: var(--si-green);
            box-shadow: 0 0 10px rgba(0, 255, 185, 0.1);
        }

        .twin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .twin-name {
            font-size: 12px;
            font-weight: 700;
            font-family: 'Fira Code', monospace;
            color: var(--si-green);
        }

        .twin-chinese {
            font-size: 11px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .twin-props {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid rgba(0, 153, 153, 0.1);
            padding-top: 6px;
        }

        .prop-item {
            display: flex;
            justify-content: space-between;
        }

        .prop-name {
            font-family: 'Fira Code', monospace;
            color: var(--text-secondary);
        }

        .prop-type {
            color: var(--text-muted);
        }

        /* ── Relationship badge ── */
        .twin-relation {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 600;
            background: rgba(0, 255, 185, 0.06);
            border: 1px solid rgba(0, 255, 185, 0.2);
            color: var(--si-green);
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            margin-top: 8px;
        }

        /* ── Code Sandbox ── */
        .code-sandbox {
            background: #00040A;
            border: 1px solid rgba(0, 153, 153, 0.15);
            border-radius: 8px;
            margin-top: 12px;
            overflow: hidden;
        }

        .sandbox-header {
            background: rgba(0, 15, 30, 0.9);
            padding: 6px 12px;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(0, 153, 153, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sandbox-body {
            padding: 10px 14px;
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            line-height: 1.6;
            color: #A0C0D0;
            overflow-x: auto;
            white-space: pre;
        }

        /* ── Right Graph Widget ── */
        .right-pane {
            width: 400px;
            height: 100%;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, rgba(0, 8, 16, 0.98) 100%);
            border-left: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
            transition:
                width 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.28s ease;
        }

        #studio-layout.graph-expanded .center-pane {
            flex: 0 0 0;
            width: 0;
            min-width: 0;
            opacity: 0;
            pointer-events: none;
        }

        #studio-layout.graph-expanded .right-pane {
            width: calc(100vw - 380px);
            box-shadow: -18px 0 36px rgba(0, 0, 0, 0.36);
        }

        .graph-preview-toggle {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 185, 0.22);
            background: rgba(0, 255, 185, 0.06);
            color: var(--si-green);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            margin-left: auto;
        }

        .graph-preview-toggle:hover {
            border-color: rgba(0, 255, 185, 0.5);
            background: rgba(0, 255, 185, 0.12);
            box-shadow: 0 0 14px rgba(0, 255, 185, 0.18);
        }

        .graph-preview-toggle .icon-minimize {
            display: none;
        }

        #studio-layout.graph-expanded .graph-preview-toggle .icon-maximize {
            display: none;
        }

        #studio-layout.graph-expanded .graph-preview-toggle .icon-minimize {
            display: block;
        }

        #studioGraph {
            flex: 1;
            width: 100%;
            background: #000D1A;
            position: relative;
        }

        #studioGraph::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, rgba(0, 153, 153, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }

        .empty-blueprint {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            gap: 16px;
            text-align: center;
            padding: 40px;
        }

        .empty-icon {
            font-size: 48px;
            opacity: 0.3;
            color: var(--si-green);
        }

        /* ── Nav Links ── */
        .nav-back-btn {
            color: var(--text-secondary);
            text-decoration: none;
            border: 1px solid var(--border-subtle);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            background: var(--bg-glass);
        }

        .nav-back-btn:hover {
            border-color: var(--si-green);
            color: var(--si-green);
            background: rgba(0, 255, 185, 0.08);
        }

        /* ── Custom Interactive Tooltip styles ── */
        .studio-tooltip {
            position: fixed;
            background: rgba(0, 18, 36, 0.85);
            border: 1px solid var(--si-green);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            box-shadow: 0 4px 16px rgba(0, 255, 185, 0.2);
            pointer-events: none;
            z-index: 10000;
            backdrop-filter: blur(10px);
            max-width: 280px;
            line-height: 1.5;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .studio-tooltip-hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        .tt-title {
            font-weight: 700;
            font-family: 'Fira Code', monospace;
            color: var(--si-green);
            font-size: 13px;
            margin-bottom: 4px;
            border-bottom: 1px dashed rgba(0, 255, 185, 0.2);
            padding-bottom: 4px;
        }

        .tt-sub {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 11px;
            margin-bottom: 4px;
        }

        .tt-desc {
            color: var(--text-secondary);
            font-size: 11px;
            margin-top: 4px;
        }

        .tt-meta {
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 2px 4px;
            border-radius: 3px;
        }

        /* ── AI Intelligent Planner Modal styles ── */
        .planner-modal {
            position: fixed;
            inset: 0;
            z-index: 20000;
            background: rgba(0, 8, 16, 0.85);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.25s ease;
        }

        .planner-modal-hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        .planner-modal-content {
            width: 900px;
            max-width: 95vw;
            height: 600px;
            max-height: 85vh;
            background: rgba(0, 18, 36, 0.95);
            border: 1px solid rgba(0, 255, 185, 0.35);
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 255, 185, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modalSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalSlideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .planner-modal-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .planner-modal-header h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .planner-badge {
            background: rgba(0, 255, 185, 0.08);
            border: 1px solid rgba(0, 255, 185, 0.3);
            color: var(--si-green);
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .planner-modal-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Chat side */
        .planner-chat-container {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-subtle);
            background: rgba(0, 8, 16, 0.2);
            overflow: hidden;
        }

            scrap: { fill: "#546E7A", stroke: "#78909C" },
            equipmentstate: { fill: "#29B6F6", stroke: "#4FC3F7" },
            shipping: { fill: "#827717", stroke: "#9E9D24" },

            other: { fill: "#505050", stroke: "#707070" }
        };

        // ── App Init ──
        window.addEventListener("DOMContentLoaded", async () => {
            // Read selected industry from URL parameters or localStorage
            const urlParams = new URLSearchParams(window.location.search);
            currentIndustry = urlParams.get("product_line") || urlParams.get("industry") || localStorage.getItem("selected_product_line") || "general";

            // Expose the current industry in the header as a badge
            displayIndustryBadge();

            try {

            }

            // Listen to checkbox change to reload scenario list
            const chkIncludeGeneral = document.getElementById("chkIncludeGeneral");

                    chkIncludeGeneral.checked = savedPref === "true";
                }
                chkIncludeGeneral.addEventListener("change", (e) => {

                    loadScenariosList();
                });
            }

            // Listen to search scenarios input changes
            const txtSearchScenarios = document.getElementById("txtSearchScenarios");
            if (txtSearchScenarios) {
                txtSearchScenarios.addEventListener("input", filterScenarios);
            }

            // Load presets dynamically from the polymorphic router
            await loadScenariosList();

            // Map button listener removed - custom mapping is now handled fully in the parallel AI planner co-pilot dialogue.

            // Export button listener
            document.getElementById("btnExportBlueprint").addEventListener("click", exportBlueprintHTML);

            document.getElementById("btnToggleGraphPreview").addEventListener("click", () => {
                setGraphPreviewExpanded(!graphPreviewExpanded);
            });

            window.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && graphPreviewExpanded) {
                    setGraphPreviewExpanded(false);
                }
            });

            window.addEventListener("resize", resizeStudioGraph);

            // ── AI Intelligent Planner Workspace Redirect ──
            const btnLaunchPlanner = document.getElementById("btnLaunchPlanner");
            btnLaunchPlanner.addEventListener("click", () => {
                window.location.href = `/static/planner.html?industry=${currentIndustry}`;
            });

            // Intercept back button if running inside parent iframe
            const backBtn = document.querySelector(".nav-back-btn");
            if (backBtn) {
                backBtn.addEventListener("click", (e) => {
                    if (window.parent && window.parent !== window && typeof window.parent.closeStudioIframe === "function") {
                        e.preventDefault();
                        window.parent.closeStudioIframe();
                    }
                });
            }



            // Expose globally accessible search callbacks to resolve card clicks
            window.previewPresetInStudio = async function (id, name) {
                try {
                    const scrollArea = document.getElementById("presetsScrollArea");
                    scrollArea.querySelectorAll(".preset-card").forEach(c => c.classList.remove("active"));
                    const matchingCard = scrollArea.querySelector(`.preset-card[data-preset="${id}"]`);
                    if (matchingCard) {
                        matchingCard.classList.add("active");
                        matchingCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }

                    // Load G6 Subgraph
                    await loadPreset(id);
                    
                    let displayName = name || id;
                    const matchedSc = activeScenarios.find(sc => sc.scenario_id === id);
                    if (matchedSc) {
                        displayName = matchedSc.name;
                    }
                    showToast(`👁️ 已在右侧加载「${displayName}」的本体子图！`);
                } catch (e) {
                    console.error("Preview preset in studio failed:", e);
                }
            };

            window.loadPresetInStudio = function (id) {
                // Hotload routing redirect
                window.location.href = `/static/planner.html?load_preset=${id}&industry=${currentIndustry}`;
            };

            // ── Scenario QA Agent Interactivity Logic ──
            const qaChatBody = document.getElementById("qaChatBody");
            const qaInput = document.getElementById("qaInput");
            const qaSendBtn = document.getElementById("qaSendBtn");
            const qaStopBtn = document.getElementById("qaStopBtn");
            const qaClearBtn = document.getElementById("qaClearBtn");
            let qaHistory = [];
            let qaAbortController = null;

            async function handleQaSend() {
                const text = qaInput.value.trim();
                if (!text) return;

                // 1. Append User Message
                appendQaMessage("user", text);
                qaInput.value = "";
                qaInput.focus();

                // 2. Disable Controls & Show typing state
                qaInput.disabled = true;
                qaSendBtn.disabled = true;
                qaSendBtn.style.display = "none";
                qaStopBtn.style.display = "flex";
                
                // Create a placeholder message for the assistant stream
                const assistantNode = appendQaMessage("system qa-agent-typing", "⚡ AI 助理正在检索场景库并思考中...");

                qaAbortController = new AbortController();
                const signal = qaAbortController.signal;

                try {
                    // Push to local conversation history
                    qaHistory.push({ role: "user", content: text });

                    const chkIncludeGeneral = document.getElementById("chkIncludeGeneral");
                    const includeGeneral = chkIncludeGeneral ? chkIncludeGeneral.checked : true;

                    // 3. Send Q&A request to Backend hybrid RAG API (Streaming)
                    const res = await fetch("/api/scenarios/qa", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            question: text,
                            history: qaHistory,
                            industry: currentIndustry,
                            include_general: includeGeneral
                        }),
                        signal: signal
                    });
                    
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let fullText = "";
                    let buffer = "";

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split("\n");
                        buffer = lines.pop() || "";

                        for (const line of lines) {
                            if (!line.startsWith("data: ")) continue;
                            try {
                                const payload = JSON.parse(line.slice(6));
                                if (payload.type === "chunk") {
                                    if (assistantNode.classList.contains("qa-agent-typing")) {
                                        assistantNode.classList.remove("qa-agent-typing");
                                        assistantNode.innerHTML = "";
                                    }
                                    fullText += payload.content;
                                    assistantNode.innerHTML = formatQaText(fullText);
                                    qaChatBody.scrollTo({ top: qaChatBody.scrollHeight });
                                } else if (payload.type === "error") {
                                    assistantNode.innerHTML = `<span style="color:#FF6666">❌ ${payload.content}</span>`;
                                }
                            } catch (_) {}
                        }
                    }

                    // Push assistant message to conversation history
                    qaHistory.push({ role: "assistant", content: fullText });

                    // Keep history capped to avoid prompt bloating
                    if (qaHistory.length > 20) {
                        qaHistory = qaHistory.slice(-20);
                    }

                } catch (err) {
                    if (err.name === "AbortError") {
                        if (assistantNode.classList.contains("qa-agent-typing")) {
                            assistantNode.classList.remove("qa-agent-typing");
                        }
                        assistantNode.innerHTML = `<span style="color:#FFA500; font-weight:600;">⚠️ 问答已由用户中断。</span>`;
                    } else {
                        console.error("QA Agent error:", err);
                        assistantNode.innerHTML = `❌ 场景导航助理连接异常，请确保后台服务器在线：${err.message}`;
                    }
                } finally {
                    qaInput.disabled = false;
                    qaSendBtn.disabled = false;
                    qaSendBtn.style.display = "flex";
                    qaStopBtn.style.display = "none";
                    qaAbortController = null;
                    qaInput.focus();
                }
            }

            function appendQaMessage(role, content) {
                const msgNode = document.createElement("div");
                msgNode.className = `qa-agent-msg qa-agent-msg-${role.includes("user") ? "user" : "system"}`;
                if (role.includes("typing")) {
                    msgNode.classList.add("qa-agent-typing");
                }
                msgNode.innerHTML = content;
                qaChatBody.appendChild(msgNode);
                
                // Smooth scroll to bottom
                qaChatBody.scrollTo({ top: qaChatBody.scrollHeight, behavior: 'smooth' });
                return msgNode;
            }

            function formatQaText(text) {
                // Convert [SC_xxx] to clickable link/badge
                let html = text.replace(/\[(SC_\d+)\]/g, (match, sid) => {
                    let scName = sid;
                    const found = activeScenarios.find(s => s.scenario_id === sid);
                    if (found) {
                        scName = found.name;
                    }
                    return `<span class="qa-badge-link" onclick="window.previewPresetInStudio('${sid}', '${scName}')" title="点击在右侧直接预览此场景子图">${sid}</span>`;
                });

                // Simple bold markdown
                html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                // Simple paragraph and line breaks
                html = html.replace(/\n/g, '<br/>');

                return html;
            }

            // Bind Event Listeners
            qaSendBtn.addEventListener("click", handleQaSend);
            qaStopBtn.addEventListener("click", () => {
                if (qaAbortController) {
                    qaAbortController.abort();
                }
            });
            qaInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    handleQaSend();
                }
            });
            
            qaClearBtn.addEventListener("click", () => {
                if (qaAbortController) {
                    qaAbortController.abort();
                }
                qaHistory = [];
                qaChatBody.innerHTML = `
                    <div class="qa-agent-msg qa-agent-msg-system">
                        您好！我是西门子 Opcenter 场景导航 AI。对话已清空。请输入您的查找意图，例如：
                        <br/><br/>
                        💬 <i>“找一个与冷链过期自动 Hold 相关的场景”</i>
                    </div>
                `;
                showToast("🧹 场景问答对话历史已清空！");
            });
        });

        // ── G6 Graph Initialization & Event Hooking ──
        function recreateGraph(nodes, edges) {
            const container = document.getElementById("studioGraph");
            
            // 1. Destroy existing graph instance safely to prevent Canvas Layer desync
            if (graph) {
                try {
                    graph.destroy();
                } catch (e) {
                    console.warn("Failed to destroy G6 graph instance:", e);
                }
                graph = null;
            }
            
            // 2. Instantiate a fresh G6 graph instance
            graph = new G6.Graph({
                container: "studioGraph",
                width: container.clientWidth,
                height: container.clientHeight,
                autoFit: "view",
                padding: [45, 45, 45, 45],
                layout: {
                    type: "dagre",
                    rankdir: "TB",
                    nodesep: 35,
                    ranksep: 55,
                    controlPoints: true,
                },
                behaviors: [
                    "drag-canvas",
                    "zoom-canvas",
                    {
                        type: "drag-element",
                        state: null,
                    },
                    "optimize-viewport-transform",
                ],
                node: {
                    type: "circle",
                    style: {
                        size: 32,
                        fill: "#009999",
                        stroke: "#00B8B8",
                        lineWidth: 1.5,
                        labelText: (d) => d.data?.chineseName ? (d.data.label || d.id) + '\n(' + d.data.chineseName + ')' : (d.data?.label || d.id),
                        labelFill: "#E8F0F2",
                        labelFontSize: 8.5,
                        labelFontWeight: 700,
                        labelPlacement: "bottom",
                        labelOffsetY: 2,
                    }
                },
                edge: {
                    type: "quadratic",
                    style: {
                        stroke: "rgba(0,255,185,0.15)",
                        lineWidth: 1.5,
                        endArrow: {
                            path: 'M 0,0 L 4,2 L 4,-2 Z',
                            fill: 'rgba(0,255,185,0.15)'
                        }
                    }
                }
            });

            // 3. Register G6 Event Listeners for interactive tooltips
            const studioTooltip = document.getElementById("studioTooltip");

            graph.on("node:pointerenter", (evt) => {
                const nodeId = evt.target.id;
                const nodeData = graph.getNodeData(nodeId);
                if (!nodeData || !nodeData.data) return;
                const d = nodeData.data;

                studioTooltip.innerHTML = `
                    <div class="tt-title">${d.label || nodeId}</div>
                    <div class="tt-sub">${d.chineseName || ""}</div>
                    <div class="tt-desc">${d.description || "暂无类描述说明。"}</div>
                    <div class="tt-meta">
                        <span>模块: ${d.module || "other"}</span>
                        <span>层级: ${d.layer || "Config"}</span>
                    </div>
                `;
                studioTooltip.classList.remove("studio-tooltip-hidden");
            });

            graph.on("node:pointermove", (evt) => {
                if (studioTooltip.classList.contains("studio-tooltip-hidden")) return;
                const clientX = evt.client?.x ?? 0;
                const clientY = evt.client?.y ?? 0;
                studioTooltip.style.left = (clientX + 16) + "px";
                studioTooltip.style.top = (clientY - 10) + "px";
            });

            graph.on("node:pointerleave", () => {
                studioTooltip.classList.add("studio-tooltip-hidden");
            });

            graph.on("edge:pointerenter", (evt) => {
                const edgeId = evt.target.id;
                const edgeData = graph.getEdgeData(edgeId);
                if (!edgeData) return;
                const d = edgeData.data || {};
                const source = edgeData.source;
                const target = edgeData.target;

                const sourceNode = graph.getNodeData(source);
                const targetNode = graph.getNodeData(target);
                const sourceChinese = sourceNode?.data?.chineseName || "";
                const targetChinese = targetNode?.data?.chineseName || "";
                const sourceDisplay = sourceChinese ? `${source} (${sourceChinese})` : source;
                const targetDisplay = targetChinese ? `${target} (${targetChinese})` : target;

                studioTooltip.innerHTML = `
                    <div class="tt-title" style="color: #00FFB9; border-color: rgba(0, 255, 185, 0.2);">🔗 ${d.label || "ONTOLOGY_RELATION"}</div>
                    <div class="tt-sub">${sourceDisplay} ➔ ${targetDisplay}</div>
                    <div class="tt-desc">${d.description || "MES系统内置本体关联边"}</div>
                    <div class="tt-meta">
                        <span>关系名: ${d.label || "relation"}</span>
                        <span>基数: ${d.cardinality || "MANY_TO_ONE"}</span>
                    </div>
                `;
                studioTooltip.classList.remove("studio-tooltip-hidden");
            });

            graph.on("edge:pointermove", (evt) => {
                if (studioTooltip.classList.contains("studio-tooltip-hidden")) return;
                const clientX = evt.client?.x ?? 0;
                const clientY = evt.client?.y ?? 0;
                studioTooltip.style.left = (clientX + 16) + "px";
                studioTooltip.style.top = (clientY - 10) + "px";
            });

            graph.on("edge:pointerleave", () => {
                studioTooltip.classList.add("studio-tooltip-hidden");
            });

            // 4. Bind data and trigger G6 render
            graph.setData({ nodes, edges });
            Promise.resolve(graph.render()).then(() => {
                resizeStudioGraph();
            });
        }

        // ── Custom Simple Parsing Mapping Engine (RAG match fallback) ──
        function performCustomMapping(text) {
            if (!rawOverview) {
                alert("图谱数据尚未加载，请稍候...");
                return;
            }

            // Extract matching classes dynamically from text using keyword scanning
            const matchedClasses = new Set();
            rawOverview.nodes.forEach(node => {
                const cn = node.id.toLowerCase();
                const ch = (node.data?.chineseName || "").toLowerCase();
                
                if (text.toLowerCase().includes(cn) || 
                    (ch && text.toLowerCase().includes(ch))) {
                    matchedClasses.add(node.id);
                }
            });

            // Default fallback if nothing matches
            if (matchedClasses.size === 0) {
                matchedClasses.add("Container");
                matchedClasses.add("Spec");
                matchedClasses.add("Resource");
            }

            // Group into 3 sequential steps dynamically
            const arr = Array.from(matchedClasses);
            const steps = [
                {
                    step: "Step 1: 业务准备与容器启动",
                    desc: "在此阶段，系统启动业务场景，涉及基础容器与初始主数据核验。",
                    twins: arr.slice(0, Math.ceil(arr.length / 3)),
                    rels: [],
                    code: "SELECT * FROM Container WHERE HoldStatus = 0;"
                },
                {
                    step: "Step 2: 工序执行与设备绑定",
                    desc: "物理设备开始处理在制品批次，并执行工步流程指定的数据记录。",
                    twins: arr.slice(Math.ceil(arr.length / 3), Math.ceil(arr.length * 2 / 3)),
                    rels: [],
                    code: "UPDATE Resource SET ResourceStatusCodeId = 'Active' WHERE ResourceId = 'R-Station01';"
                },
                {
                    step: "Step 3: 质检警报与业务处置",
                    desc: "对生产完工后的数据进行分析计算，如判定出异常自动触发警报阻断。",
                    twins: arr.slice(Math.ceil(arr.length * 2 / 3)),
                    rels: [],
                    code: "INSERT INTO Event (EventName, EventDescription) VALUES ('QA-Exception', 'Business abnormal triggered.');"
                }
            ];

            // Filter out empty twins steps
            const filteredSteps = steps.filter(s => s.twins.length > 0);

            // Populate some relationships from rawOverview for matched classes (allowing self-loops for keyword filtering)
            filteredSteps.forEach(step => {
                step.twins.forEach(c1 => {
                    rawOverview.edges.forEach(edge => {
                        if (edge.source === c1 && step.twins.includes(edge.target)) {
                            step.rels.push(`${c1} -[${edge.data.label}]-> ${edge.target}`);
                        }
                    });
                });
            });

            renderBlueprint(filteredSteps);
            updateGraphHighlight(filteredSteps);
        }

                "HAS_PREREQUISITE": ["前置", "先决条件", "依赖"]
            };

            steps.forEach(s => {

                const textContext = `${s.step} ${s.desc} ${s.code || ""}`.toLowerCase();
                s.rels = s.rels.filter(rel => {
                    const relParts = rel.split(" -[");
                    if (relParts.length === 2) {
                        const source = relParts[0].trim();
                        const targetParts = relParts[1].split("]-> ");
                        if (targetParts.length === 2) {
                            const relName = targetParts[0].trim();
                            const target = targetParts[1].trim();
                            if (source === target) {
                                const keywords = SELF_LOOP_KEYWORDS[relName];
                                if (!keywords) return false;
                                return keywords.some(kw => textContext.includes(kw.toLowerCase()));
                            }
                        }
                    }
                    return true;

        // ── Update Right G6 Subgraph Highlights Connecting Active Twins ──
        async function updateGraphHighlight(steps) {
            // Collect all unique twins across steps
            const twins = [];
            steps.forEach(s => {
                if (s.twins) {
                    s.twins.forEach(t => {
                        if (!twins.includes(t)) twins.push(t);
                    });
                }
            });

            if (twins.length === 0) {
                if (graph) {
                    try {
                        graph.destroy();
                    } catch(e) {}
                    graph = null;
                }
                currentGraphNodes = [];
                currentGraphEdges = [];
                return;
            }

            try {
                // Fetch dynamic graph connections directly from Neo4j (Single Source of Truth)
                const res = await fetch("/api/scenarios/graph", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ twins: twins })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const subGraphData = await res.json();

                // Format G6 nodes and edges
                const formattedNodes = subGraphData.nodes.map(n => ({
                    id: n.id,
                    type: "circle",
                    data: n.data,
                    style: {
                        fill: (COLORS[n.data?.module] || COLORS.other || { fill: "#2979FF" }).fill,
                        stroke: (COLORS[n.data?.module] || COLORS.other || { stroke: "#82B1FF" }).stroke,
                        size: 36,
                        labelText: n.data?.chineseName ? (n.data.label || n.id) + '\n(' + n.data.chineseName + ')' : (n.data?.label || n.id),
                        labelFill: "#E8F0F2",
                        labelFontSize: 8.5,
                        labelFontWeight: 700,
                        labelPlacement: "bottom",
                        labelOffsetY: 2,
                    }
                }));

                const formattedEdges = subGraphData.edges
                    .map((e, idx) => {
                        const relStr = `${e.source} -[${e.data.label}]-> ${e.target}`;
                        const isActive = steps.some(s => s.rels && s.rels.includes(relStr));

                        if (e.source === e.target && !isActive) {
                            return null;
                        }

                        return {
                            id: `sub-e-${idx}`,
                            type: "quadratic",
                            source: e.source,
                            target: e.target,
                            data: e.data,
                            style: {
                                stroke: isActive ? "#00FFB9" : "rgba(255, 255, 255, 0.12)",
                                lineWidth: isActive ? 1.8 : 1.0,
                                lineDash: isActive ? [] : [4, 4],
                                endArrow: {
                                    path: 'M 0,0 L 4,2 L 4,-2 Z',
                                    fill: isActive ? '#00FFB9' : 'rgba(255, 255, 255, 0.12)'
                                }
                            }
                        };
                    })
                    .filter(Boolean);

                currentGraphNodes = formattedNodes;
                currentGraphEdges = formattedEdges;
                // Destroy and recreate graph instance to resolve WebGL/canvas layer desyncs
                recreateGraph(formattedNodes, formattedEdges);
            } catch (e) {
                console.error("Failed to fetch dynamic Neo4j scenario graph:", e);
            }
        }

            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

            graph.on("node:pointerenter", (evt) => {

                tooltip.innerHTML = \`

            graph.on("edge:pointerenter", (evt) => {
                const edgeId = evt.target.id;
                const edgeData = graph.getEdgeData(edgeId);
                if (!edgeData) return;
                const d = edgeData.data || {};
                const source = edgeData.source;
                const target = edgeData.target;

                const sourceNode = graph.getNodeData(source);
                const targetNode = graph.getNodeData(target);
                const sourceChinese = sourceNode?.data?.chineseName || "";
                const targetChinese = targetNode?.data?.chineseName || "";
                const sourceDisplay = sourceChinese ? \`\${source} (\${sourceChinese})\` : source;
                const targetDisplay = targetChinese ? \`\${target} (\${targetChinese})\` : target;

                tooltip.innerHTML = \`
                    <div class="tt-title" style="color: #00FFB9; border-color: rgba(0, 255, 185, 0.2);">🔗 \${d.label || "ONTOLOGY_RELATION"}</div>
                    <div class="tt-sub">\${sourceDisplay} ➔ \${targetDisplay}</div>
                    <div class="tt-desc">\${d.description || "MES系统内置本体关联边"}</div>
                    <div class="tt-meta">
                        <span>关系名: \${d.label || "relation"}</span>
                        <span>基数: \${d.cardinality || "MANY_TO_ONE"}</span>
                    </div>
                \`;
                tooltip.classList.remove("studio-tooltip-hidden");
            });

            graph.on("edge:pointermove", (evt) => {
                if (tooltip.classList.contains("studio-tooltip-hidden")) return;
                const clientX = evt.client?.x ?? 0;
                const clientY = evt.client?.y ?? 0;
                tooltip.style.left = (clientX + 16) + "px";
                tooltip.style.top = (clientY - 10) + "px";
            });

            graph.on("edge:pointerleave", () => {
                tooltip.classList.add("studio-tooltip-hidden");
            });
        });
    <\/script>
</body>
</html>`;

                const blob = new Blob([htmlContent], { type: "text/html" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `Opcenter_Digital_Blueprint_${scenarioTitle.replace(/\\s+/g, "_")}.html`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        }



    </script>
